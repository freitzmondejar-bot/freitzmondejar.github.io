<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LGU Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e7f3ff;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  background: #1877f2;
  color: white;
  padding: 10px 20px;
}

/* LOGO PLACEHOLDER */
.logo {
  width: 50px;
  height: 50px;
  background: white;
  border-radius: 8px;
  margin-right: 15px;
}

/* TITLE AREA */
.header h2 {
  margin: 0;
  font-size: 20px;
}

/* SUB TITLE */
.subtitle {
  text-align: center;
  padding: 10px;
  font-weight: bold;
  color: #1c1e21;
}

/* MAIN WRAPPER */
.wrapper {
  display: flex;
  height: calc(100vh - 110px);
}

/* LEFT PANEL */
.left {
  width: 35%;
  min-width: 280px;
  background: #ffffff;
  overflow-y: auto;
  padding: 10px;
  border-right: 2px solid #d0e3ff;
}

/* RIGHT PREVIEW */
.right {
  flex: 1;
  background: #f5f9ff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* BUTTON BOXES */
.box {
  display: block;
  background: #1877f2;
  color: white;
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  font-size: 14px;
}

.box:hover {
  background: #0f5bd6;
}

/* IFRAME */
iframe {
  width: 95%;
  height: 90%;
  border: none;
  border-radius: 10px;
  background: white;
}

/* MOBILE */
@media (max-width: 768px) {
  .wrapper {
    flex-direction: column;
  }

  .left {
    width: 100%;
    height: 40vh;
  }

  .right {
    height: 60vh;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo"></div>
  <h2>LGU Dashboard Portal</h2>
</div>

<!-- SUB TITLE -->
<div class="subtitle">
  Government Records & Google Sheets Access System
</div>

<!-- MAIN -->
<div class="wrapper">

  <!-- LEFT MENU -->
  <div class="left">

    <a class="box" data-link="https://docs.google.com/spreadsheets/d/1_oEKHaoPNXjZ4bWLerCy8kDhzeefV93K/edit?usp=sharing">
      GEMP Form 1A - Airconditioning & Generators
    </a>

    <a class="box" data-link="https://docs.google.com/spreadsheets/d/1pXi3BnlBl4uDUd2Kdf3isE2C_z89rJAo/edit?usp=sharing&ouid=102949677516563276460&rtpof=true&sd=true">
      GEMP Form 1B - Survey on Centralized Airconditioning Units
    </a>

    <a class="box" data-link="https://docs.google.com/spreadsheets/d/your-link-3">
      Sheet 3
    </a>

    <a class="box" data-link="https://docs.google.com/spreadsheets/d/your-link-4">
      Sheet 4
    </a>

    <a class="box" data-link="https://docs.google.com/spreadsheets/d/your-link-5">
      Sheet 5
    </a>

    <a class="box" data-link="https://docs.google.com/spreadsheets/d/your-link-6">
      Sheet 6
    </a>

    <a class="box" data-link="https://docs.google.com/spreadsheets/d/your-link-7">
      Sheet 7
    </a>

    <a class="box" data-link="https://docs.google.com/spreadsheets/d/your-link-8">
      Sheet 8
    </a>

    <a class="box" data-link="https://docs.google.com/spreadsheets/d/your-link-9">
      Sheet 9
    </a>

    <a class="box" data-link="https://docs.google.com/spreadsheets/d/your-link-10">
      Sheet 10
    </a>

  </div>

  <!-- RIGHT PREVIEW -->
  <div class="right">
    <iframe id="preview"></iframe>
  </div>

</div>

<!-- SCRIPT -->
<script>
const boxes = document.querySelectorAll(".box");
const preview = document.getElementById("preview");

// CLICK ONLY (your request)
boxes.forEach(box => {
  box.addEventListener("click", () => {
    preview.src = box.getAttribute("data-link");
  });
});
</script>

</body>
</html>
