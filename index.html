<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LGU Dashboard</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #e7f3ff; /* light Facebook-style blue */
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 30px;
  color: #1c1e21;
}

.container {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  max-width: 1000px;
  margin: auto;
}

.box {
  background: #1877f2; /* Facebook blue */
  color: white;
  padding: 30px;
  text-align: center;
  border-radius: 10px;
  text-decoration: none;
  font-size: 16px;
  transition: 0.3s;
  font-weight: bold;
}

.box:hover {
  background: #0f5bd6;
  transform: scale(1.05);
}
</style>

</head>

<body>

<h1>LGU Dashboard Links</h1>

<div class="container">

  <a class="box" href="https://docs.google.com/spreadsheets/d/your-link-1" target="_blank">Sheet 1</a>
  <a class="box" href="https://docs.google.com/spreadsheets/d/your-link-2" target="_blank">Sheet 2</a>
  <a class="box" href="https://docs.google.com/spreadsheets/d/your-link-3" target="_blank">Sheet 3</a>
  <a class="box" href="https://docs.google.com/spreadsheets/d/your-link-4" target="_blank">Sheet 4</a>
  <a class="box" href="https://docs.google.com/spreadsheets/d/your-link-5" target="_blank">Sheet 5</a>

  <a class="box" href="https://docs.google.com/spreadsheets/d/your-link-6" target="_blank">Sheet 6</a>
  <a class="box" href="https://docs.google.com/spreadsheets/d/your-link-7" target="_blank">Sheet 7</a>
  <a class="box" href="https://docs.google.com/spreadsheets/d/your-link-8" target="_blank">Sheet 8</a>
  <a class="box" href="https://docs.google.com/spreadsheets/d/your-link-9" target="_blank">Sheet 9</a>
  <a class="box" href="https://docs.google.com/spreadsheets/d/your-link-10" target="_blank">Sheet 10</a>

</div>

</body>
</html>
